apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: promptcraft-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: promptcraft-studio
      rules:

        - alert: PromptCraftPodDown
          expr: kube_deployment_status_replicas_available{namespace="default",deployment="promptcraft-studio"} < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PromptCraft Studio pod is down"
            description: "No PromptCraft Studio pod is currently available."

        - alert: PromptCraftPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="default",pod=~"promptcraft-studio.*"}[10m]) > 2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "PromptCraft Studio pod restarting"
            description: "A PromptCraft Studio pod restarted more than twice in the last 10 minutes."

        - alert: PromptCraftHighCPU
          expr: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="default",pod=~"promptcraft-studio.*",container!="POD",container!=""}[5m])) > 0.4
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PromptCraft Studio high CPU"
            description: "PromptCraft Studio pod CPU usage is above 400m."
