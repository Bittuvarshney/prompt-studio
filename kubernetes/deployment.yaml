apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptcraft-studio
  labels:
    app: promptcraft-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: promptcraft-studio
  template:
    metadata:
      labels:
        app: promptcraft-studio
    spec:
      containers:
        - name: promptcraft-studio
          image: promptcraft-studio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: promptcraft-secrets
                  key: groq-api-key
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
