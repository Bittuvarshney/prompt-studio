apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promptcraft-studio
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: promptcraft.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: promptcraft-studio
                port:
                  number: 80
